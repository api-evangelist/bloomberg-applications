description: >-
  Bloomberg publishes no plans, tiers or prices for this API surface. Replaces a 2026-05-04 bulk
  sweep scaffold that invented Free / Professional / Enterprise tiers with a 1,000-request monthly
  quota and 10 rpm — none of which Bloomberg has ever published. Access to the Data License
  Hypermedia API and to B-PIPE / Server API entitlements is sold under contract through a
  Bloomberg sales specialist; the Desktop API carries no separate charge because it rides an
  existing Bloomberg Terminal subscription. Every product page reached ends at "Request a Demo"
  or "Contact a specialist", and no page on professional.bloomberg.com states a number.
plans: []
commercial_model:
  type: contract-only
  self_service_signup: false
  public_price_list: false
  trial: >-
    A free trial term exists as an enforced concept inside the API (BLPAPI returns
    FREE_TRIAL_TERM_LIMIT_REACHED), but its terms are not published.
  entry_points:
    - name: Contact a specialist
      url: https://professional.bloomberg.com/products/data/data-management/data-license/
      status: 200
    - name: API Library (SDK downloads, no account required)
      url: https://professional.bloomberg.com/support/api-library/
      status: 200
  note: >-
    The SDKs themselves are downloadable anonymously; only the data is gated. That asymmetry is
    the honest description of Bloomberg's commercial model here.
