findings:
  - Bloomberg has written publicly about building MCP for internal enterprise use, and its Head of
    Enterprise Data has commented on MCP as a standard, but no customer-facing Bloomberg MCP
    endpoint or Bloomberg-published MCP package was found.
  - Servers named "Bloomberg MCP" in public MCP directories are third-party wrappers around the
    blpapi SDK. They require the user's own Bloomberg entitlement and are not published by
    Bloomberg. They are not recorded as a Bloomberg agent surface.
  - No /.well-known/oauth-authorization-server or /.well-known/oauth-protected-resource is
    anonymously reachable on api.bloomberg.com (403 on every path), so no MCP OAuth metadata exists
    to capture.
pointer_note: >-
  No `MCPServer` pointer is wired into apis.yml. A pointer would assert that Bloomberg serves an
  MCP endpoint, and it does not. Same rule as the agent card: presence is only claimed on a hit.
