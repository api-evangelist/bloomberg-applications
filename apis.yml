aid: bloomberg-applications
name: Bloomberg Applications
description: Bloomberg's financial data and application API surface, covering the BLPAPI family (Desktop API, Server
  API and B-PIPE) reached through first-party C++, Java, C#/.NET and Python SDKs, and the Data License Hypermedia
  API served over HTTP at api.bloomberg.com/eap. The surface delivers real-time and historical pricing, reference
  data, intraday bars and ticks, and streaming market data subscriptions. BLPAPI is an asynchronous binary event
  protocol rather than a REST API, so it carries no HTTP status codes, rate-limit headers or idempotency keys; errors
  and quota exhaustion arrive as typed messages on the event queue. Bloomberg publishes no OpenAPI description,
  no public pricing and no self-service signup — data access is entitlement-gated and provisioned under contract
  — but the SDKs, their full version archive and the BLPAPI developer guides are downloadable without an account.
