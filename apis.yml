- aid: bloomberg-applications:bloomberg-terminal-connect-api
  name: Bloomberg Terminal Connect API
  description: 'Desktop API for accessing Bloomberg Terminal functionality programmatically through Excel, custom
    applications, and third-party systems. No public baseURL is recorded because none exists: the BLPAPI Desktop
    API connects to the local Bloomberg Communication Server process on the operator''s own machine (127.0.0.1:8194)
    and inherits authorization from the logged-in Terminal session, so the endpoint is the consumer''s workstation
    rather than a Bloomberg-hosted host.'
